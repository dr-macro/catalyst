name: 📅 TradingEconomics Calendar Scraper

on:
  schedule:
    - cron: '10 7 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  scrape-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas python-dotenv

      - name: ▶️ Run scraper
        run: python calendar_scraper.py

      - name: Commit & push updated calendar
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "github-actions@github.com"
          git add calendar/tradingeconomics_calendar_master.csv
          git commit -m "📄 Update calendar [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
